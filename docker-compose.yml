services:
  kafka:
    image: apache/kafka:3.8.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    healthcheck:
      test: /opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 20s

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka:
        condition: service_healthy
    volumes:
      - ./docker/create-topics.sh:/create-topics.sh:ro
    entrypoint: ["bash", "/create-topics.sh"]
    environment:
      KAFKA_BOOTSTRAP: kafka:9092

  kafka-ui:
    image: kafbat/kafka-ui:v1.1.0
    ports:
      - "8080:8080"
    environment:
      DYNAMIC_CONFIG_ENABLED: "true"
      KAFKA_CLUSTERS_0_NAME: poc
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      kafka:
        condition: service_healthy

  mongo:
    image: mongo:7.0
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "27017:27017"
    healthcheck:
      test: mongosh --quiet --eval "try { rs.status().ok } catch (e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'mongo:27017'}]}).ok }"
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
      - "1025:1025"

  activation-api:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: activation-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: activation-api
      KAFKA_GROUP_ID: activation-api
      MONGO_URI: mongodb://mongo:27017/activation?replicaSet=rs0&directConnection=true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  billing-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: billing-service
    environment:
      PORT: 3001
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: billing-service
      KAFKA_GROUP_ID: billing-svc
      MONGO_URI: mongodb://mongo:27017/billing?replicaSet=rs0&directConnection=true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  provisioning-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: provisioning-service
    environment:
      PORT: 3002
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: provisioning-service
      KAFKA_GROUP_ID: provisioning-svc
      MONGO_URI: mongodb://mongo:27017/provisioning?replicaSet=rs0&directConnection=true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  notification-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: notification-service
    environment:
      PORT: 3003
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: notification-service
      KAFKA_GROUP_ID: notification-svc
      MONGO_URI: mongodb://mongo:27017/notification?replicaSet=rs0&directConnection=true
      SMTP_HOST: mailhog
      SMTP_PORT: 1025
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      mailhog:
        condition: service_started

  crm-analytics-service:
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: crm-analytics-service
    environment:
      PORT: 3004
      KAFKA_BROKERS: kafka:9092
      KAFKA_CLIENT_ID: crm-analytics-service
      KAFKA_GROUP_ID: crm-analytics
      MONGO_URI: mongodb://mongo:27017/crm?replicaSet=rs0&directConnection=true
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy

  demo-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: http://localhost:3000
    depends_on:
      - activation-api
